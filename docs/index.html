      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "e604b8635b4fd4d7521cab540fc86940", "console": [], "id": "Hbol", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:24px;\"\u003E\n  \u003Cdiv\u003E\n    \u003Ch1\u003ETraining Workshop on Data Science and AI Tools for Beginners\u003C/h1\u003E\n    \u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003E30 September 2026 \u00b7 Bayes Business School, City St George's, University of London\u003C/strong\u003E\u003C/span\u003E\n  \u003C/div\u003E\n  \u003Cimg\n    src=\"public/BayesCityStGeorge's_logoNoBkgd.png\"\n    alt=\"Bayes City St George's logo\"\n    style=\"width:160px; height:auto; object-fit:contain;\"\n  /\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d284ca40950ba0bba57ebec79e630be0", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C!--\n# Training Workshop on Data Science and AI Tools for Beginners\n\n**30 September 2026 \u00b7 Bayes Business School, City St George's, University of London**\n--\u003E\n\n\u003Ch2 id=\"why-these-tools-matter\"\u003EWhy These Tools Matter\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThis workshop introduces a connected toolkit for modern research. Here's what you'll explore and how each piece fits together:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPython\u003C/strong\u003E \u2014 A beginner-friendly, general-purpose programming language and the backbone of most data science work. It's the language used to write web scrapers, run NLP analyses, and build the demo code you'll see throughout the day.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ER\u003C/strong\u003E \u2014 A language built specifically for statistics and data analysis. Many researchers use it alongside Python; learning both gives you flexibility depending on your discipline's conventions.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGitHub Copilot\u003C/strong\u003E \u2014 An AI coding assistant that suggests code as you type. It lowers the barrier to writing Python/R by helping you self-learn syntax and troubleshoot, making it the ideal companion for beginners tackling the other tools on this list.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeb scraping\u003C/strong\u003E \u2014 The practice of automatically extracting data from websites, typically written in Python. It's often the first step in a research pipeline, feeding raw text into later NLP analysis.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWeb crawling\u003C/strong\u003E \u2014 A related technique for systematically navigating and collecting pages across a website (rather than a single page), often used to gather large datasets before scraping extracts the specific content you need.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ENatural Language Processing (NLP)\u003C/strong\u003E \u2014 A field of techniques for analysing text data, frequently applied \u003Cem\u003Eafter\u003C/em\u003E scraping/crawling has collected raw material. Concepts like n-grams and lemmatization (below) are core NLP building blocks.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EN-grams\u003C/strong\u003E \u2014 Sequences of adjacent words (or characters) used to capture patterns in text, a foundational technique within NLP for tasks like language modelling or text classification.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ELemmatization\u003C/strong\u003E \u2014 The process of reducing words to their base/dictionary form (e.g., \"running\" \u2192 \"run\"), a common text pre-processing step in NLP that improves the accuracy of downstream analysis.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EJupyter\u003C/strong\u003E \u2014\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Emarimo/Jupyter\u003C/strong\u003E \u2014 Jupyter is an interactive notebook environment for writing and running Python/R code alongside notes and outputs, widely used for exploratory data science and demos. marimo is a newer, reactive alternative to Jupyter, designed to make notebooks more robust and reproducible, addressing various limitations of Jupyter.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVS Code\u003C/strong\u003E \u2014 A popular code editor that integrates with GitHub Copilot, Jupyter notebooks, and cloud environments like Codespaces, making it a natural hub for the whole workflow.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EGitHub\u003C/strong\u003E \u2014 A platform for storing, sharing, and version-controlling code, and the account you'll need to access GitHub Copilot and Codespaces.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECodespaces\u003C/strong\u003E \u2014 GitHub's cloud-based development environment, letting you run VS Code, Python/R, and your scraping/NLP code entirely in the browser, without installing anything locally.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ELightning.ai\u003C/strong\u003E \u2014 A cloud computing platform providing free-tier compute for running your code, useful when your laptop isn't powerful enough for larger data science or AI tasks.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ETogether, these tools form a pipeline: \u003Cstrong\u003Ewrite and edit code (VS Code, Jupyter/marimo) \u2192 get AI assistance (GitHub Copilot) \u2192 run it in the cloud (Codespaces, Lightning.ai) \u2192 collect data (web scraping/crawling) \u2192 analyse it (NLP, n-grams, lemmatization) \u2192 manage and share it all (GitHub, Python/R)\u003C/strong\u003E.\u003C/span\u003E\n\u003Chr /\u003E\n\u003Ch2 id=\"training-workshop-on-data-science-and-ai-tools-for-beginners\"\u003ETraining Workshop on Data Science and AI Tools for Beginners\u003C/h2\u003E\n\u003Ch3 id=\"30-september-2026\"\u003E30 September 2026\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003ECurious about \u003Cstrong\u003EPython\u003C/strong\u003E, \u003Cstrong\u003ER\u003C/strong\u003E, \u003Cstrong\u003EGitHub Copilot\u003C/strong\u003E, \u003Cstrong\u003Eweb scraping\u003C/strong\u003E, natural language processing (NLP) or related tools/techniques \u2014 but haven't had a chance to try them out yet? Maybe you've also heard of tools/platforms like \u003Cstrong\u003EJupyter\u003C/strong\u003E, \u003Cstrong\u003Emarimo\u003C/strong\u003E, \u003Cstrong\u003EVS Code\u003C/strong\u003E, \u003Cstrong\u003ECodespaces\u003C/strong\u003E, \u003Cstrong\u003EGitHub\u003C/strong\u003E, \u003Cstrong\u003ELightning.ai\u003C/strong\u003E, or techniques and concepts like \u003Cstrong\u003Eweb crawling\u003C/strong\u003E, \u003Cstrong\u003En-grams\u003C/strong\u003E, \u003Cstrong\u003Elemmatization\u003C/strong\u003E but they still feel a bit out of reach?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThen this \u003Cem\u003Ebeginner-friendly, hands-on\u003C/em\u003E workshop is for you! In just one day, you'll get to explore some of these tools and techniques that can facilitate your research. \u003Cem\u003ENo prior experience with Python or R is required\u003C/em\u003E \u2014 just curiosity and a willingness to try something new!\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe'll guide you through with demo code and show you how AI coding assistants (like GitHub Copilot) can help you along the way. By the end of the day, you'll have taken your first steps into using these tools to support your research.\u003C/span\u003E\n\u003Ch3 id=\"workshop-arrangement\"\u003EWorkshop Arrangement\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThis one-day workshop is organised and delivered by \u003Ca href=\"#\"\u003EDr Andrew Yim\u003C/a\u003E, Bayes Business School, City St George's, University of London and supported by the Pathway and Thematic training funding from the SeNSS/SENSS Student Cohort Development Fund (SCDF). Attendees are required to \u003Cstrong\u003Ebring their own laptops\u003C/strong\u003E. The workshop will be held in the Bayes Business School Building at 106 Bunhill Row, London.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAttendees will have hands-on experience in using various data science and AI tools through cloud computing environments. They are required to do advanced preparation, including signing up for \u003Cstrong\u003Efree-tier\u003C/strong\u003E accounts on the following platforms (\u003Cstrong\u003Eat least a week before\u003C/strong\u003E the workshop):\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"https://education.github.com/pack\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Eeducation.github.com/pack\u003C/a\u003E\u003Cul\u003E\n\u003Cli\u003EFollow the sequence: Sign up for Student Developer Pack \u2192 Create an account \u2192 Sign up for GitHub (using school email address). Do \u003Cstrong\u003ENOT\u003C/strong\u003E use the 'Continue with Google/Apple' options to sign up, because a school email address facilitates claiming GitHub Education benefits.\u003C/li\u003E\n\u003Cli\u003ESee details at \u003Ca href=\"https://docs.github.com/en/education/about-github-education/github-education-for-students\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Edocs.github.com/en/education/about-github-education/github-education-for-students\u003C/a\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://lightning.ai/pricing\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Elightning.ai/pricing\u003C/a\u003E (Follow the sequence: Get started free/Start free \u2192 (school) Email)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"target-audience\"\u003ETarget Audience\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is a training workshop for beginners, with minimal to no prior experience, who see the relevance and importance of using data science tools for their research and using AI tools to self-learn/assist coding for research. This is \u003Cstrong\u003Enot\u003C/strong\u003E suitable for those who have already used the mentioned tools and techniques on a regular basis.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPriority will be given to \u003Cstrong\u003ESENSS/SeNSS students\u003C/strong\u003E who can benefit most from the workshop. Unfilled places will be offered to unfunded students from \u003Cstrong\u003ESENSS/SeNSS institutions\u003C/strong\u003E: \u003Ca href=\"https://www.senss.ac.uk/about\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Esenss.ac.uk/about\u003C/a\u003E.\u003C/span\u003E\n\u003Ch3 id=\"further-details\"\u003EFurther Details\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EPlaces:\u003C/strong\u003E limited to a maximum of 40 attendees\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETime:\u003C/strong\u003E begins 9:30am, finishes by 6:30pm on the scheduled date\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVenue postcode:\u003C/strong\u003E EC1Y 8TZ\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ECost:\u003C/strong\u003E free to registered participants (a sandwich lunch will be served); attendees cover their own travel and accommodation costs\u003C/li\u003E\n\u003Cli\u003ERegistrants failing to attend the workshop may be blacklisted for future events held by the organiser\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"application\"\u003EApplication\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPlease email a CV and a brief description about the below to Dr Andrew Yim (\u003Ca href=\"mailto:a.yim@citystgeorges.ac.uk\"\u003Ea.yim@citystgeorges.ac.uk\u003C/a\u003E) by the deadline on \u003Cstrong\u003E31 August 2026\u003C/strong\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EYour research direction(s)\u003C/li\u003E\n\u003Cli\u003EWhy data science and AI tools are important / relevant to your research\u003C/li\u003E\n\u003Cli\u003EYour expectation on how this workshop might benefit your research\u003C/li\u003E\n\u003Cli\u003EYour affiliation: (a) SENSS / (b) SeNSS / (c) unfunded students of SENSS/SeNSS institutions\u003C/li\u003E\n\u003Cli\u003EYour year of study in PhD programme\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EAcceptance notification will be sent by 14 September 2026.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.24.0", "script_metadata_hash": null}, "version": "1"},
